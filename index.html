<!DOCTYPE html>
<html lang="eng">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
	<title>MSH-clicker</title>
</head>
<body>
	<div class="container">
		<div class = 'main-page'>
			<div class="money"></div>
			<img onclick = 'gainCoin()' class = 'mushroom' src="./assets/mushroom.png">
		</div>

		<div class="shop-page">
			<div class="improvements">
				<div class="card">
					<h2></h2>
				</div>
				<div class="card">
					<h2></h2>
				</div>
				<div class="card">
					<h2></h2>
				</div>
				<div class="card">
					<h2></h2>
				</div>
			</div>
		</div>
		
		<nav>
			<div onclick = 'showMainPage()' class = 'nav-item'>Home</div>
			<div onclick = 'showShopPage()' class = 'nav-item'>Shop</div>
		</nav>
	</div>
	<style type="text/css">
		@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');

		body{
			background: #2B2545;
			background: linear-gradient(357deg, rgba(37, 37, 70, 1) 14%, rgba(0, 0, 38, 1) 75%);
			background-repeat: no-repeat;
			background-size: auto 100vh;
			font-family: 'JetBrains Mono';
			font-weight: 700;
			font-size: 4rem;
			color: #f8ad5a;
		}

		.container{
			text-align: center;
			padding-inline:2rem;
		}

		.money{
			font-weight: 800;
			text-shadow: 1px 2px 0px #f9f871;
		}

		.mushroom{
			width:13rem;
			height:12rem;
			margin-top: 7rem;
			transition: all 0.053s;
		}

		.mushroom:active{
			transform: scale(1.055);
		}

		@keyframes opacityAnimation{
			0%{
				opacity: 0;
			}

			100%{
				opacity: 100%;
			}
		}
		
		nav{
			position: fixed;
			display: flex;
			bottom: 1rem;
			right: 78vh;
		}

		.nav-item{
			margin-inline: 2rem;
			font-size:3.25rem;
		}

		.nav-item:hover{
			color: #fadf8C;
		}

		.shop-page{
			display: none;
		}

		.improvements{
			display: grid;
			grid-template-columns: 1fr 1fr;
			grid-template-rows: 18rem 18rem;
			gap: 4rem;
			margin-top:2rem;
		}

		.card{
			padding: 0.5rem;
			padding-inline: 1rem;
		}

		@media only screen and (max-width: 650px) {
			body{
				font-size:3.25rem;
			}
			
		 	nav{
				right: 1vh;
			}

			.improvements{
				grid-template-rows: 11rem 11rem;
				gap:2rem;
			}
		}
	</style>
	<script>
		let money = document.querySelector('.money');

		if (localStorage.getItem('moneyField')){
			money.innerHTML = localStorage.getItem('moneyField');
		} else{
			money.innerHTML = 1;
		}

		const gainCoin = function(){
			money.innerHTML = parseInt(money.innerHTML) + 1;
			localStorage.setItem('moneyField', money.innerHTML)
		}


		// navigation logic
		const shopPage = document.querySelector('.shop-page')
		const mainPage = document.querySelector('.main-page');



		function showPage(pageToShow, pageToHide){
			pageToHide.style.display = 'none';
			pageToShow.style.display = 'block';

			pageToShow.style.animationName = 'opacityAnimation';
			pageToShow.style.animationDuration = '1.2s';
		}

		function showMainPage(){
			showPage(mainPage, shopPage);
		}

		function showShopPage(){
			showPage(shopPage, mainPage);
		}
		
		const initialTouchX, initialTouchY, finalTouchX, finalTouchY;

		const swipeThreshold = 100;

		function handleSwipe(startX, endX, onSwipeLeft, onSwipeRight){
			let horizontalDistance = initialTouchX - finalTouchX;
			let verticalDistance = initialTouchY - finalTouchY;

			if (Math.abs(horizontalDistance) > Math.abs(verticalDistance) && Math.abs(horizontalDistance) > swipeThreshold){
				if (finalTouchX < 0){
					onSwipeLeft();
				}else{
					onSwipeRight();
				}
			}
		}

		function swipeLeft(){
			document.querySelector('.container').style.background = 'red';
		}

		function swipeRight(){
			document.querySelector('.container').style.background = 'blue';
		}


		window.addEventListener('touchstart', (event) => {
			initialTouchX = event.touches[0].clientX;
			initialTouchY = event.touches[0].clientY;
		})

		window.addEventListener('touchend', (event) => {
			finalTouchX = event.changedTouches[0].clientX;
			finalTouchY = event.changedTouches[0].clientY;

			handleSwipe(initialTouchX, finalTouchX, swipeLeft, swipeRight);
		})



	</script>
</body>
</html>
