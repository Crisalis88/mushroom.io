<html lang="eng">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
	<title>MSH-clicker</title>
</head>
<body>
	<div class="container">
		<div class = 'main-page'>
			<div class="money"></div>
			<img class = 'mushroom' src="./assets/mushroom.png">
		</div>

		<div class="shop-page">
			<div class="improvements">
				<div class="card">
					<h2></h2>
          				<p>100</p>
				</div>
				<div class="card">
					<h2></h2>
				</div>
				<div class="card">
					<h2></h2>
				</div>
				<div class="card">
					<h2></h2>
				</div>
			</div>
      <div class = 'buyBlock'>
        Drag Here To Buy
      </div>
		</div>

	<nav>
		<div onclick = "showMainPage()">
			Home
		</div>
		<div onclick = "showShopPage()">Shop</div>
	</nav>
	</div>
	<style type="text/css">
		@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');

		body{
			background: #2B2545;
			background: linear-gradient(357deg, rgba(32, 32, 65, 1) 12%, rgba(0, 0, 38, 1) 70%);
			background-repeat: no-repeat;
			background-size: auto 100vh;
			font-family: 'JetBrains Mono';
			font-weight: 700;
			font-size: 4rem;
			color: #f8ad5a;
      user-select:none;
		}

		.container{
			text-align: center;
			padding-inline:2rem;
		}

		.money{
			font-weight: 800;
			text-shadow: 1px 2px 0px #f9f871;
		}

		.mushroom{
			width:13rem;
			height:12rem;
			margin-top: 7rem;
			transition: all 0.053s;
		}

		.mushroom:active{
			transform: scale(1.055);
		}

	  .banner{
      position:relative;
      top:3rem;
      background:rgba(192, 192, 192, 0.15);
      border:2px solid #dedede;
      border-radius:0.5em;
      padding-block:1.25rem;
      font-size:1.75rem;
    }	

		@keyframes opacityAnimation{
			0%{
				opacity: 0;
			}

			100%{
				opacity: 100%;
			}
		}
		
		.shop-page{
			display: none;
		}

		.improvements{
			display: grid;
			grid-template-columns: 1fr 1fr;
			grid-template-rows: 18rem 18rem;
			gap: 4rem;
			margin-top:2rem;
		}

		nav{
			position:absolute;
			right:50vh;
			bottom:0.75vh;
      display:flex; 
      gap:3rem;
			right: 5.75vh;
		}

		.card{
			padding-block: 1.25rem;
      padding-inline:0.75rem;
      text-align:left;
      background:#969bc7;
		}

    .card h2{
      font-size:1.25rem;
    }

    .buyBlock{
      background: #F9AD57;
      background: linear-gradient(8deg, rgba(249, 173, 87, 0.93) 6%, rgba(249, 248, 113, 0.97) 94%);
      color:#FEFEFE;
      font-size:3rem;
      border-radius:0.25em;
      margin-top:4rem;
      padding:1.25rem;
      text-shadow:2px 2px 5px #101010;
    }

		@media only screen and (max-width: 650px) {
			body{
				font-size:3.25rem;
			}
			
			.improvements{
				grid-template-rows: 11rem 11rem;
				gap:2rem;
			}
		}

    .propertyValue{
      color:#33DDDD;
    }
	</style>
	<script>
		let money = document.querySelector('.money');

    let mushroomIMG = document.querySelector('.mushroom');
    class Mushroom{
      constructor(name){
        this.name = name;
        this.img = mushroomIMG;
        this.coinsPerTap = 1;
      }
    } 

		if (localStorage.getItem('moneyField')){
			money.innerHTML = localStorage.getItem('moneyField');
		} else{
			money.innerHTML = 1;
		}

		const gainCoin = function(){
			money.innerHTML = parseInt(money.innerHTML) + 1;
			localStorage.setItem('moneyField', money.innerHTML)
		}
   
    mushroomIMG.addEventListener('touchstart', (event) => {
      gainCoin();
    })
		// navigation logic
		const shopPage = document.querySelector('.shop-page')
		const mainPage = document.querySelector('.main-page');


		function showPage(pageToShow, pageToHide){
			pageToHide.style.display = 'none';
			pageToShow.style.display = 'block';

			pageToShow.style.animationName = 'opacityAnimation';
			pageToShow.style.animationDuration = '1.2s';
		}

		function showMainPage(){
			showPage(mainPage, shopPage);
		}

		function showShopPage(){
			showPage(shopPage, mainPage);
		}
    
    let touchMStart;
    mushroomIMG.addEventListener("touchstart", () => {
      touchMStart = new Date().getSeconds();
      console.log("touch start:" + touchMStart)
    });

    mushroomIMG.addEventListener("touchend", () => {
      let touchEnd = new Date().getSeconds();
      console.log("touch end: " + touchEnd)
      let difference = touchEnd - touchMStart;

      console.log("difference: " + difference);

      if (difference >= 2){
        let divDescription = document.createElement("div");
        let darkMicelium = new Mushroom("Dark Micelium");

        divDescription.innerHTML = `Name: <span class = "propertyValue" >${darkMicelium.name}</span> <br> Coins Per Tap: <span class = "propertyValue">${darkMicelium.coinsPerTap}</span>`;

        divDescription.classList.add('banner');
        mainPage.append(divDescription); 

        divDescription.style.animationName = 'opacityAnimation';
			  divDescription.style.animationDuration = '0.8s';

        divDescription.addEventListener('touchstart', () => {
          divDescription.remove();
        });
      }
    });

	document.querySelector('.card').addEventListener('touchstart', () => {
		money.innerHTML = parseInt(money.innerHTML) - 100;
		localStorage.setItem('moneyField', money.innerHTML);

        	let divBanner = document.createElement('img');
        
        	// meme img styles
        	divBanner.style.position = "relative";
        	divBanner.style.width = '22rem';

        	divBanner.style.top = '3rem'
        	divBanner.style.left = '3.75rem';

        	divBanner.setAttribute("src", "./assets/banner.jpeg");
        	document.body.append(divBanner);
	})
	</script>
</body>
</html>
